plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'jacoco'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.example.villagewalls'
version = '1.0.0'
base {
    archivesName = 'villagewalls'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                villagewalls {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                villagewalls {
                    source sourceSets.main
                }
            }
        }
        data {
            workingDirectory project.file('run')
            args '--mod', 'villagewalls', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                villagewalls {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('processResources', ProcessResources).configure { task ->
    var replaceProperties = [
            minecraft_version   : '1.20.1',
            forge_version       : '47.3.0',
            mod_version        : project.version,
            mod_id             : 'villagewalls',
            mod_name           : 'Village Walls'
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand(replaceProperties)
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'Village Walls',
                'Specification-Vendor'    : 'villagewalls',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'villagewalls',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport', JacocoReport).configure {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification).configure {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            element = 'CLASS'
            includes = [
                    'com.example.villagewalls.logic.*'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
        rule {
            element = 'CLASS'
            includes = [
                    'com.example.villagewalls.config.WallStyleRegistry',
                    'com.example.villagewalls.config.WallStyle'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.8
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'jacoco'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'com.bettercontent'
version = '1.0.0'
base {
    archivesName = 'better-village-fortifications'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                better_village_fortifications {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                better_village_fortifications {
                    source sourceSets.main
                }
            }
        }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'better_village_fortifications,minecraft'
            mods {
                better_village_fortifications {
                    source sourceSets.main
                }
            }
        }
        data {
            workingDirectory project.file('run')
            args '--mod', 'better_village_fortifications', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                better_village_fortifications {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.13'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

if (file('src/gameteststructures').exists()) {
    tasks.register('syncGameTestStructures', Copy) {
        from('src/gameteststructures')
        into(project.file('run-gametest/gameteststructures'))
    }

    tasks.matching { it.name.startsWith('prepareRun') }.configureEach {
        dependsOn(tasks.named('syncGameTestStructures'))
    }
}

tasks.named('processResources', ProcessResources).configure { task ->
    var replaceProperties = [
            minecraft_version   : '1.20.1',
            forge_version       : '47.4.13',
            mod_version        : project.version,
            mod_id             : 'better_village_fortifications',
            mod_name           : 'Better Village Fortifications'
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand(replaceProperties)
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'Village Walls',
                'Specification-Vendor'    : 'better_village_fortifications',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'better_village_fortifications',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('stageRuntimeJar', Copy) {
    group = 'build'
    description = 'Stages the reobfuscated runtime jar into build/libs using the canonical release filename.'
    dependsOn tasks.named('reobfJar')
    from layout.buildDirectory.file('reobfJar/output.jar')
    into layout.buildDirectory.dir('libs')
    rename { "${project.base.archivesName.get()}-${project.version}.jar" }
}

tasks.named('assemble').configure {
    dependsOn tasks.named('stageRuntimeJar')
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('headlessGameTest') {
    group = 'verification'
    description = 'Runs Forge game tests in a headless dedicated server.'
    dependsOn tasks.named('runGameTestServer')
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport', JacocoReport).configure {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification).configure {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            element = 'CLASS'
            includes = [
                    'com.bettercontent.bettervillagefortifications.logic.*'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
        rule {
            element = 'CLASS'
            includes = [
                    'com.bettercontent.bettervillagefortifications.config.WallStyleRegistry',
                    'com.bettercontent.bettervillagefortifications.config.WallStyle'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.8
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.register('verifyFast') {
    group = 'verification'
    description = 'Runs the fast deterministic verification lane.'
    dependsOn tasks.named('check')
}

tasks.register('verifyFull') {
    group = 'verification'
    description = 'Runs the full verification lane, including headless Forge GameTests.'
    dependsOn tasks.named('verifyFast')
    dependsOn tasks.named('headlessGameTest')
}
